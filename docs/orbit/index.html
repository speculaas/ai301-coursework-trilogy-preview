<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>Orbit Explorer v3</title><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div><p class="eyebrow">INTERACTIVE ORBIT EXPLORER · V3</p><h1 id="pageTitle">Solar System</h1><p id="pageLede" class="lede"></p></div><nav><a href="../status/">Status boards</a></nav></header>
<div id="systemTabs" class="tabs" role="group" aria-label="Choose system"><button data-system="solar">Solar</button><button data-system="aurum">Aurum</button><button data-system="animorphs">Animorphs</button></div><p id="modeNotice" class="notice"></p>
<section class="layout"><div><section class="stage"><canvas id="systemCanvas" tabindex="0" aria-label="Interactive orbit canvas. Left and right arrows cycle bodies; Enter selects."></canvas><div id="tooltip" class="tooltip" hidden></div><div class="hint">Drag pan · wheel/pinch zoom · ←/→ cycle · Enter select</div></section>
</div>
<aside class="info" aria-live="polite"><p class="eyebrow">SELECTED BODY</p><h2 id="infoName"></h2><p id="infoType"></p><ul id="infoFacts"></ul><div id="bodyButtons" class="body-buttons"></div><section class="anim-panel" aria-label="Animation controls"><p class="eyebrow">ANIMATION</p><section class="controls" aria-label="Simulation controls"><button id="playButton">Pause</button><button id="staticButton" type="button" aria-pressed="false">Static</button><label>Speed <input id="speedInput" type="range" min="0" max="3" value="1" step=".05"><output id="speedOutput">1.00×</output></label><label><input id="labelsInput" type="checkbox" checked> Labels</label><label><input id="orbitsInput" type="checkbox" checked> Orbits</label><label>Scale <select id="scaleInput"><option value="readable">Readable</option><option value="realistic">Realistic-ish</option></select></label><button id="resetButton">Reset</button></section><section class="math-controls" aria-label="Ellipse overlays"><label>Eccentricity × <input id="eccInput" type="range" min="1" max="4" value="1" step=".1"><output id="eccOutput">1.0</output></label><label><input id="markersInput" type="checkbox" checked> Apsides</label><label><input id="areaInput" type="checkbox"> Equal-area sweep</label><label><input id="constructionInput" type="checkbox"> Ellipse construction</label><label><input id="lagrangeInput" type="checkbox"> L1–L5 schematic</label></section><p id="scaleNote" class="scale-note"></p><p class="scale-note">Static: fixed epoch (day 0) in the original Aurum v1 quarter-circle framing — centre near the lower-left, no motion. Also via <code>?static=1</code>.</p></section></aside></section></main><script type="module" src="./app.js"></script></body></html>
