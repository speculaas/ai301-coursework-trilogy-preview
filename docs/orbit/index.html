<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>Solar System Orbit Explorer</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div><p class="eyebrow">INTERACTIVE ORBIT EXPLORER</p><h1>Solar System</h1><p class="lede">Sun and eight planets, shown with selectable readable and realistic-ish scales.</p></div><a class="back" href="../status/">Status boards</a></header>
<section class="layout"><div><section class="stage" aria-label="Interactive solar system"><canvas id="systemCanvas" tabindex="0" aria-label="Orbit canvas. Use the planet buttons below for keyboard selection."></canvas><div id="tooltip" class="tooltip" hidden></div><div class="hint">Drag to pan · wheel or pinch to zoom · select a body</div></section>
<section class="controls" aria-label="Simulation controls"><button id="playButton" type="button">Pause</button><label>Speed <input id="speedInput" type="range" min="0" max="3" value="1" step="0.05"><output id="speedOutput">1.00×</output></label><label><input id="labelsInput" type="checkbox" checked> Labels</label><label><input id="orbitsInput" type="checkbox" checked> Orbits</label><label>Scale <select id="scaleInput"><option value="readable">Readable</option><option value="realistic">Realistic-ish</option></select></label><button id="resetButton" type="button">Reset view</button></section><p id="scaleNote" class="scale-note">Readable mode compresses orbital distances and enlarges bodies.</p></div>
<aside id="infoPanel" class="info" aria-live="polite"><p class="eyebrow">SELECTED BODY</p><h2 id="infoName">Sun</h2><p id="infoType">G-type star</p><ul id="infoFacts"></ul><div id="bodyButtons" class="body-buttons" aria-label="Select a celestial body"></div></aside></section><noscript>This interactive model requires JavaScript.</noscript></main><script type="module" src="./app.js"></script></body></html>
